# OpenSearch for the OpenCTI platform running on another host.
# Security plugin ON (TLS + login): the platform connects over the internet.
# Only the AWS Security Group restricts port 9200 (allow the OpenCTI IP only).
# The data volume is called opencti-search_osdata: keep this name whatever the folder is called.
name: opencti-search

services:
  opensearch:
    build:
      context: .
      args:
        OPENSEARCH_VERSION: "3.7.0"   # the only place the version is written
    restart: always
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms${OPENSEARCH_HEAP:-4g} -Xmx${OPENSEARCH_HEAP:-4g}
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - osdata:/usr/share/opensearch/data
      - ./config/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - ./certs:/usr/share/opensearch/config/certs:ro
      - ./security/internal_users.yml:/usr/share/opensearch/config/opensearch-security/internal_users.yml:ro
      - ./security/roles.yml:/usr/share/opensearch/config/opensearch-security/roles.yml:ro
      - ./security/roles_mapping.yml:/usr/share/opensearch/config/opensearch-security/roles_mapping.yml:ro
    ports:
      - "9200:9200"

volumes:
  osdata:
